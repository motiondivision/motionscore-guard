name: Motion Performance Guard
description: Catch animation performance regressions on every PR. Part of Motion Cloud.
author: Motion
branding:
  icon: activity
  color: yellow

inputs:
  url:
    description: Base URL to audit. Defaults to the preview URL from the deployment_status event. Required on push events, where it is usually your production URL.
    required: false
    default: ""
  pages:
    description: Newline-separated paths to audit, relative to url. Empty = "/" plus up to 4 short paths from <url>/sitemap.xml on the same host.
    required: false
    default: ""
  floor:
    description: Fail the check if any page grades worse than this tier (S/A/B/C/D/F), or "none" for no floor.
    required: false
    default: "C"
  max-drop:
    description: Largest drop in grades from the main-branch baseline that still passes the check.
    required: false
    default: "1"
  serve:
    description: Optional command that builds and serves the site before auditing, e.g. "npm run build && npx serve dist -l 4173"
    required: false
    default: ""
  cli-version:
    description: motionscore CLI version to run
    required: false
    default: "0.2.1"
  api-url:
    description: Motion API base URL
    required: false
    default: "https://api.motion.dev"

outputs:
  verdict:
    description: 'pass, fail, waived or baseline from the API. not_entitled, not_installed, unavailable or error when the run was not graded. Empty when the deployment was skipped.'
    value: ${{ steps.send.outputs.verdict }}
  check-url:
    description: URL of the "Motion Performance Guard" check run, when the API created one
    value: ${{ steps.send.outputs.check-url }}

runs:
  using: composite
  steps:
    # Lets the bare `uses:` line work on preview-deploy workflows: with no
    # url input, read the preview URL from the deployment_status event, and
    # no-op politely on the pending/failure states so users don't need the
    # `if:` guard.
    - name: Resolve URL
      id: resolve
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        EVENT_NAME: ${{ github.event_name }}
        DEPLOY_STATE: ${{ github.event.deployment_status.state }}
        DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
      run: |
        if [ "$EVENT_NAME" = "deployment_status" ] && [ "$DEPLOY_STATE" != "success" ]; then
          echo "Deployment state is '$DEPLOY_STATE'; Guard audits once it reaches 'success'. Skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        URL="${INPUT_URL:-$DEPLOY_URL}"
        if [ -z "$URL" ]; then
          echo "::error::No url input, and this event carries no preview deployment URL. Pass url: (on push events, your production URL). See https://github.com/motiondivision/motionscore-guard#setup"
          exit 1
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "url=$URL" >> "$GITHUB_OUTPUT"

    - name: Cache Chrome
      if: steps.resolve.outputs.skip != 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-motionscore-${{ inputs.cli-version }}

    - name: Audit pages
      if: steps.resolve.outputs.skip != 'true'
      shell: bash
      env:
        BASE_URL: ${{ steps.resolve.outputs.url }}
        PAGES: ${{ inputs.pages }}
        FLOOR: ${{ inputs.floor }}
        MAX_DROP: ${{ inputs.max-drop }}
        SERVE: ${{ inputs.serve }}
        CLI_VERSION: ${{ inputs.cli-version }}
        # GitHub's ubuntu-latest (24.04+) blocks Chrome's sandbox via
        # AppArmor; ephemeral runners make --no-sandbox the standard call.
        MOTIONSCORE_NO_SANDBOX: "1"
      run: |
        set -uo pipefail
        OUT="$RUNNER_TEMP/motionscore"
        rm -rf "$OUT"
        mkdir -p "$OUT"
        BASE="${BASE_URL%/}"

        if [ -n "$SERVE" ]; then
          echo "Starting server: $SERVE"
          bash -c "$SERVE" &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE"; then break; fi
            sleep 2
          done
        fi

        # Resolves the page list (sitemap when pages is empty) and checks
        # the floor and max-drop inputs before any audit runs.
        node "$GITHUB_ACTION_PATH/pages.mjs" > "$OUT/pages.txt" || exit 1

        i=0
        while IFS= read -r page; do
          [ -z "$page" ] && continue
          i=$((i+1))
          echo "::group::Auditing $BASE$page"
          # GitHub injects bash -e into composite run steps; the || keeps a
          # failing audit from aborting the loop. A page with no summary
          # file is sent as a failed audit.
          npx --yes "motionscore@$CLI_VERSION" "$BASE$page" --guard --summary "$OUT/summary-$i.json" || echo "::warning::Audit failed for $page"
          echo "::endgroup::"
        done < "$OUT/pages.txt"

    - name: Send results
      if: steps.resolve.outputs.skip != 'true'
      id: send
      shell: bash
      env:
        BASE_URL: ${{ steps.resolve.outputs.url }}
        FLOOR: ${{ inputs.floor }}
        MAX_DROP: ${{ inputs.max-drop }}
        API_URL: ${{ inputs.api-url }}
      run: node "$GITHUB_ACTION_PATH/send.mjs" "$RUNNER_TEMP/motionscore"
