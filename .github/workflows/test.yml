name: Test
# Self-test for the public mirror. The unit job covers the action's helpers.
# The live job runs the action for real against motion.dev and sends the
# result to the Guard API. It passes whatever the verdict is, as long as
# the action reports one, because this repository may not be entitled.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test lib.node-test.mjs

  live:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Audit motion.dev
        id: guard
        uses: ./
        with:
          url: https://motion.dev
          pages: |
            /

      - name: Assert outputs
        env:
          VERDICT: ${{ steps.guard.outputs.verdict }}
        run: |
          echo "verdict=$VERDICT"
          [[ "$VERDICT" =~ ^(pass|fail|waived|baseline|not_entitled|not_installed|unavailable)$ ]] || { echo "unexpected verdict output"; exit 1; }
